[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qevc"
version = "0.3.6"
description = "Conditional validity auditing of quantum event classifiers under collider systematics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Roberto Fernández-Barrios", email = "roberto.fernandez.b@deusto.es" },
    { name = "Iker Pastor-López", email = "iker.pastor@deusto.es" },
    { name = "Asier González-Santocildes", email = "gonzalez.asier@deusto.es" },
    { name = "Pablo García Bringas", email = "pablo.garcia.bringas@deusto.es" },
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.2",
    "qiskit-machine-learning>=0.8",
    "qiskit-aer>=0.15",
    "qiskit-ibm-runtime>=0.30",
]
hep = [
    "uproot>=5.3",
    "awkward>=2.6",
    "vector>=1.4",
    "iminuit>=2.25",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
