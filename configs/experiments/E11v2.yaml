# E11v2 — Strengthened CMS real-data demonstration (registry E11v2; D-026)
# Identical claim definitions and frozen MC hyperparameters as E11; the
# real-data side moves to the FULL Run2012B+C files (lumi fraction -> 1.0),
# MC stays on the verified mirror files re-weighted to full luminosity.
experiment: E11v2
inherits: [E01, E11]
cms_interim: data/interim/cms_full
lumi_mode: full            # D-026: LUMI_PB for both data and MC weights
train:                     # unchanged from E11 (frozen deployment)
  val_fraction: 0.30
  seed: 1111
  qksvc_n_train: 2000
sensor:
  n_sample: 2000
  n_noise_draws: 20
  seed: 1112
claims:                    # identical text/rules as E11 (frozen)
  C1_event_accuracy:
    text: "event-level accuracy of f on collision data >= M_S - 0.05"
    requires: "I2 (target labels)"
  C2_w_norm:
    text: "W+jets normalization consistent with MC within 30% in the high-mT CR"
    requires: "I1 + control-region aggregates"
    mt_cut: 70.0
    tolerance: 0.30
  C3_no_shift:
    text: "no MC->data shift detectable at the QK-MMD2 sensor noise floor"
    requires: "I1 (unlabeled target)"
  C4_ss_qcd:
    text: "SS control region shows a significant data excess over MC (QCD)"
    requires: "I1 + control-region aggregates"
alpha: 0.05
compare_to_v1: results/tables/E11_cms_case_study.json
